services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: falange
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falange}
      POSTGRES_DB: falange
    volumes:
      # Postgres 18+: o mount vai na raiz, nao em /data (a imagem cria o
      # subdiretorio por major version). Montar em /data faz a imagem abortar.
      - pgdata:/var/lib/postgresql
    ports:
      # 5433 no host: a 5432 ja e do Postgres 18 nativo desta maquina.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U falange -d falange"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://falange:${POSTGRES_PASSWORD:-falange}@db:5432/falange
    depends_on:
      db:
        condition: service_healthy

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://falange:${POSTGRES_PASSWORD:-falange}@db:5432/falange
      LIMITE_SOBRECARGA: ${LIMITE_SOBRECARGA:-5}
    ports:
      # 8010 no host: 8000 e 8001 ja estao com outros projetos desta maquina.
      # Dentro da rede do compose o backend continua na 8000.
      - "8010:8000"
    healthcheck:
      # A imagem e slim: nao tem curl nem wget, entao usa o proprio Python.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Transporte SSE: o que voce expoe para o time.
  # O stdio NAO vira servico: ele e um subprocesso que o client local sobe.
  mcp-sse:
    build: .
    command: python mcp_http_sse_example.py
    environment:
      BACKEND_URL: http://backend:8000
      FALANGE_DOCS_ROOT: /app/exemplos
      MCP_SSE_HOST: 0.0.0.0
    ports:
      - "8765:8765"
    depends_on:
      # Espera o backend responder de fato, nao so o container existir.
      backend:
        condition: service_healthy

volumes:
  pgdata:
